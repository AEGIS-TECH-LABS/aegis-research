services:
  - type: web
    name: aegis-research
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: PERSONAL_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
